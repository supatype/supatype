name: Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # CDN soak: weekly (install.sh path; linux only)
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exercises `supatype dev` (Docker compose) + @supatype/client.
  # Sibling images (postgres/engine/server) come from Docker Hub; realtime +
  # control-plane are built from this monorepo.
  # macOS native is disabled until native Postgres ships contrib extensions (pgcrypto).
  dev-integration:
    name: supatype dev (docker)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SUPATYPE_PROVIDER: docker
      SUPATYPE_POSTGRES_IMAGE: supatype/postgres:latest
      SUPATYPE_ENGINE_IMAGE: supatype/schema-engine:latest
      SUPATYPE_SERVER_IMAGE: supatype/server:latest
      SUPATYPE_REALTIME_IMAGE: supatype/realtime:ci-dev
      SUPATYPE_CONTROL_PLANE_IMAGE: supatype/control-plane:ci-dev

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache component binaries
        uses: actions/cache@v4
        with:
          path: ~/.supatype/cache
          key: supatype-binaries-v2-ubuntu-22.04-${{ hashFiles('packages/cli/src/binary-cache.ts', 'tests/integration/supatype.config.ts') }}
          restore-keys: supatype-binaries-v2-ubuntu-22.04-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      - name: Prefetch engine/server/postgres/deno binaries
        run: node tests/integration/scripts/ci-prefetch-binaries.mjs
        env:
          # From-source CLI builds have no embedded key; map the release secret.
          SUPATYPE_RELEASE_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}

      - name: Run supatype dev integration tests
        run: bash tests/integration/scripts/integration-test.sh --skip-build
        env:
          SUPATYPE_RELEASE_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-integration-logs-ubuntu
          path: |
            ~/.supatype/projects/supatype-integration/logs/
            tests/integration/.supatype/
            tests/integration/.supatype/ci-logs/
            tests/integration/.env
          retention-days: 3
          if-no-files-found: warn

  # Exercises published Docker images via `supatype self-host compose` (Linux only).
  compose-smoke:
    name: self-host compose (images)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      - name: Build control-plane image for compose smoke
        run: |
          docker build \
            --build-arg ENGINE_IMAGE=supatype/schema-engine:latest \
            -t supatype/control-plane:ci \
            -f packages/self-host-control/Dockerfile \
            packages/self-host-control

      - name: Run compose image smoke test
        run: bash tests/integration/scripts/compose-smoke.sh
        env:
          SUPATYPE_CONTROL_PLANE_IMAGE: supatype/control-plane:ci

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-logs
          path: tests/integration/.supatype/self-host/
          retention-days: 3

  # Zero to running, from the workspace build: init (docker) → dev → an API that answers.
  # Phase-10.6 row C21, kept here as provenance, the job is named for what it does.
  # macOS runners have no Docker Desktop; Colima provides the daemon.
  zero-to-running:
    name: "zero to running: workspace CLI (${{ matrix.os }})"
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # x86_64, not arm64: the arm64 macOS runners have no nested virtualisation, so Colima's `vz`
        # driver dies at "creating and starting" and no Docker daemon can come up there at all.
        #
        # `macos-15-intel`, not `macos-13`: that label was retired on 2025-12-04 and a job requesting
        # it queues forever rather than failing, see the same note in supatype-postgres's
        # native-archives workflow, which is where the current Intel label is recorded.
        os: [ubuntu-22.04, macos-15-intel]
    env:
      SUPATYPE_ZTR_INSTALL: workspace
      SUPATYPE_ZTR_KEEP_ON_FAILURE: "1"
      SUPATYPE_RELEASE_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}

    steps:
      # $RUNNER_TEMP, not ${{ runner.temp }}: the `runner` context does not exist in a
      # job-level `env:`, and referencing it there makes GitHub reject the whole file.
      - name: Choose a work root outside the checkout
        run: echo "SUPATYPE_ZTR_WORK_ROOT=$RUNNER_TEMP/zero-to-running" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Start Docker (Colima on macOS)
        if: runner.os == 'macOS'
        run: |
          brew install docker docker-compose colima
          colima start --cpu 3 --memory 8 --disk 40
          docker info

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache component binaries
        uses: actions/cache@v4
        with:
          path: ~/.supatype/cache
          key: supatype-binaries-v2-${{ matrix.os }}-${{ hashFiles('packages/cli/src/binary-cache.ts') }}
          restore-keys: |
            supatype-binaries-v2-${{ matrix.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      - name: Prefetch engine binary for init
        run: node tests/integration/scripts/ci-prefetch-binaries.mjs
        env:
          SUPATYPE_RELEASE_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}

      - name: Run the zero-to-running soak
        run: bash tests/integration/scripts/zero-to-running.sh

      - name: Upload the run's logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zero-to-running-workspace-${{ matrix.os }}
          path: ${{ runner.temp }}/zero-to-running/ztr-smoke/
          retention-days: 3
          if-no-files-found: warn

  # The same journey through the published installer, `curl | sh` from the CDN rather than the
  # workspace build, so it exercises what a new user actually runs. Linux only; not Windows.
  # Phase-10.6 row C21.
  # Back on main pushes: a v* release now publishes a CLI, so this exercises the installer
  # against a real release rather than failing for want of one. It stays off pull requests,
  # because a CDN or network problem would otherwise block reviews for an unrelated reason.
  zero-to-running-cdn:
    name: "zero to running: curl | sh install (linux)"
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SUPATYPE_ZTR_INSTALL: cdn
      SUPATYPE_ZTR_KEEP_ON_FAILURE: "1"
      # Deliberately no SUPATYPE_RELEASE_PUBLIC_KEY. The published binary embeds the key at
      # release time; supplying it here would test a configuration no user has, and would
      # hide a release that forgot to embed it, which every release so far would have.

    steps:
      # $RUNNER_TEMP, not ${{ runner.temp }}: the `runner` context does not exist in a
      # job-level `env:`, and referencing it there makes GitHub reject the whole file.
      - name: Choose a work root outside the checkout
        run: echo "SUPATYPE_ZTR_WORK_ROOT=$RUNNER_TEMP/zero-to-running-cdn" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Run the zero-to-running soak through the published installer
        run: bash tests/integration/scripts/zero-to-running.sh

      - name: Upload the run's logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zero-to-running-cdn-ubuntu
          path: ${{ runner.temp }}/zero-to-running-cdn/ztr-smoke/
          retention-days: 3
          if-no-files-found: warn

  # The publish-and-install contract, on every change rather than on demand.
  #
  # This path has produced eight defects that only a real tag exercised: a bundle that could not
  # build, an entry point that exited 0 in silence, a binary reporting 0.0.0, self-update
  # replacing a path inside the embedded filesystem, a publisher able to advertise a version the
  # binary did not carry, a formula generator fed the wrong input, hashes read from the wrong
  # source, and a bash replacement that behaved differently on macOS. Each was found by running
  # the real thing, and none would have been found by reading it.
  #
  # Builds one target for the host, serves it as the CDN layout, installs with the real
  # install.sh, asserts the installed binary reports the published version, then that a tampered
  # archive and a manifest signed by another key are both refused.
  cli-artifact-roundtrip:
    name: publish and install round trip
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Without minisign the test skips its signature checks, which are half the point.
      - name: Install minisign
        run: sudo apt-get install -y -qq minisign

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CLI
        run: pnpm --filter @supatype/cli build

      - name: Round trip
        run: bash tests/integration/scripts/cli-artifact-roundtrip.sh

