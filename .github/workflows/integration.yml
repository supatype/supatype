name: Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # CDN soak — weekly (install.sh path; linux only)
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exercises `supatype dev` (Docker compose) + @supatype/client.
  # Sibling images (postgres/engine/server) come from Docker Hub; realtime +
  # control-plane are built from this monorepo.
  # macOS native is disabled until native Postgres ships contrib extensions (pgcrypto).
  dev-integration:
    name: supatype dev (docker)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SUPATYPE_PROVIDER: docker
      SUPATYPE_POSTGRES_IMAGE: supatype/postgres:latest
      SUPATYPE_ENGINE_IMAGE: supatype/schema-engine:latest
      SUPATYPE_SERVER_IMAGE: supatype/server:latest
      SUPATYPE_REALTIME_IMAGE: supatype/realtime:ci-dev
      SUPATYPE_CONTROL_PLANE_IMAGE: supatype/control-plane:ci-dev

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache component binaries
        uses: actions/cache@v4
        with:
          path: ~/.supatype/cache
          key: supatype-binaries-v2-ubuntu-22.04-${{ hashFiles('packages/cli/src/binary-cache.ts', 'tests/integration/supatype.config.ts') }}
          restore-keys: supatype-binaries-v2-ubuntu-22.04-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      - name: Prefetch engine/server/postgres/deno binaries
        run: node tests/integration/scripts/ci-prefetch-binaries.mjs
        env:
          # From-source CLI builds have no embedded key; map the release secret.
          SUPATYPE_RELEASE_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}

      - name: Run supatype dev integration tests
        run: bash tests/integration/scripts/integration-test.sh --skip-build
        env:
          SUPATYPE_RELEASE_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-integration-logs-ubuntu
          path: |
            ~/.supatype/projects/supatype-integration/logs/
            tests/integration/.supatype/
            tests/integration/.supatype/ci-logs/
            tests/integration/.env
          retention-days: 3
          if-no-files-found: warn

  # Exercises published Docker images via `supatype self-host compose` (Linux only).
  compose-smoke:
    name: self-host compose (images)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      - name: Build control-plane image for compose smoke
        run: |
          docker build \
            --build-arg ENGINE_IMAGE=supatype/schema-engine:latest \
            -t supatype/control-plane:ci \
            -f packages/self-host-control/Dockerfile \
            packages/self-host-control

      - name: Run compose image smoke test
        run: bash tests/integration/scripts/compose-smoke.sh
        env:
          SUPATYPE_CONTROL_PLANE_IMAGE: supatype/control-plane:ci

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-logs
          path: tests/integration/.supatype/self-host/
          retention-days: 3

  # Phase 10.6 C21 — workspace CLI → init (docker) → dev → healthy API.
  # macOS runners have no Docker Desktop; Colima provides the daemon.
  zero-to-running:
    name: C21 workspace (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    env:
      SUPATYPE_C21_INSTALL: workspace
      SUPATYPE_C21_KEEP_ON_FAILURE: "1"
      SUPATYPE_RELEASE_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}

    steps:
      # $RUNNER_TEMP, not ${{ runner.temp }}: the `runner` context does not exist in a
      # job-level `env:`, and referencing it there makes GitHub reject the whole file.
      - name: Choose a work root outside the checkout
        run: echo "SUPATYPE_C21_WORK_ROOT=$RUNNER_TEMP/c21-work" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Start Docker (Colima on macOS)
        if: runner.os == 'macOS'
        run: |
          brew install docker docker-compose colima
          colima start --cpu 3 --memory 8 --disk 40
          docker info

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache component binaries
        uses: actions/cache@v4
        with:
          path: ~/.supatype/cache
          key: supatype-binaries-v2-${{ matrix.os }}-${{ hashFiles('packages/cli/src/binary-cache.ts') }}
          restore-keys: |
            supatype-binaries-v2-${{ matrix.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      - name: Prefetch engine binary for init
        run: node tests/integration/scripts/ci-prefetch-binaries.mjs
        env:
          SUPATYPE_RELEASE_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}

      - name: Run C21 zero-to-running soak
        run: bash tests/integration/scripts/zero-to-running.sh

      - name: Upload C21 logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zero-to-running-workspace-${{ matrix.os }}
          path: ${{ runner.temp }}/c21-work/c21-smoke/
          retention-days: 3
          if-no-files-found: warn

  # Phase 10.6 C21 — curl|sh CDN install path (linux only; not Windows).
  # Runs on schedule + main pushes + manual dispatch (skips PRs to avoid CDN flakiness blocking reviews).
  zero-to-running-cdn:
    name: C21 CDN install (linux)
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SUPATYPE_C21_INSTALL: cdn
      SUPATYPE_C21_KEEP_ON_FAILURE: "1"
      SUPATYPE_RELEASE_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}

    steps:
      # $RUNNER_TEMP, not ${{ runner.temp }}: the `runner` context does not exist in a
      # job-level `env:`, and referencing it there makes GitHub reject the whole file.
      - name: Choose a work root outside the checkout
        run: echo "SUPATYPE_C21_WORK_ROOT=$RUNNER_TEMP/c21-cdn-work" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Run C21 CDN zero-to-running soak
        run: bash tests/integration/scripts/zero-to-running.sh

      - name: Upload C21 CDN logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zero-to-running-cdn-ubuntu
          path: ${{ runner.temp }}/c21-cdn-work/c21-smoke/
          retention-days: 3
          if-no-files-found: warn
