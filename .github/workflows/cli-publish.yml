# Publish the standalone CLI binaries that cli-release.yml built and smoke tested, to
# releases.supatype.com/cli/.
#
# Separate from the build so release.yml can compile and run the binaries alongside the image
# builds and still publish them only once every image and binary the CLI runs is out
# (release.yml's artifacts-published job). cli-release.yml calls this too when it publishes on its
# own. Both callers run it in the same workflow run as the build, which is what lets it download
# the build's artefact.
name: CLI publish

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish, without a leading v, as cli-release.yml resolved it
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: publish to the CDN
    runs-on: ubuntu-24.04
    # Job level, not step level: both CDN steps below need the same credentials and settings.
    env:
      CLI_VERSION: ${{ inputs.version }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CDN_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.CDN_AWS_REGION }}
      # Hetzner needs path addressing and s3v4, and refuses instance metadata lookups.
      # Copied from deno-releases.yml, which is the workflow that actually works against
      # this bucket. Omitting them is how an upload fails on a real tag.
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: "10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cli-${{ inputs.version }}
          path: artifacts

      # Ordering matters. Archives and their checksums go up first and latest.json last: it is
      # the only mutable object here, so nothing advertises a version until every file that
      # version needs is already readable.
      - name: Publish to the CDN
        run: |
          set -euo pipefail
          aws configure set default.s3.addressing_style path >/dev/null
          aws configure set default.s3.signature_version s3v4 >/dev/null

          EP="${{ secrets.CDN_ENDPOINT }}"
          EP="${EP%/}"
          BUCKET="${{ secrets.CDN_BUCKET }}"
          PREFIX="s3://${BUCKET}/cli/v${CLI_VERSION}"

          # Versioned objects are immutable, matching the component archives. Nothing rewrites
          # this prefix, so a client may cache an archive and its checksum for a year without
          # them ever disagreeing. A rerun rebuilds archives with different bytes, so it keeps
          # what is already published.
          if aws s3 ls "${PREFIX}/checksums.sha256.minisig" --endpoint-url "${EP}" >/dev/null 2>&1; then
            echo "::warning::cli/v${CLI_VERSION}/ is already published. Keeping it and uploading nothing."
            exit 0
          fi

          aws s3 cp artifacts/ "${PREFIX}/" --recursive \
            --endpoint-url "${EP}" --no-progress \
            --cache-control "public, max-age=31536000, immutable"

      # A prerelease publishes its archives but must not become `latest`: install.sh and
      # `supatype self-update` both resolve the CLI through this file, so moving it to an rc
      # would ship one to everyone who never asked for it. CLI_VERSION has already lost any
      # leading v, so a '-' anywhere in it means a prerelease.
      - name: Update cli/latest.json
        if: ${{ !contains(inputs.version, '-') }}
        run: |
          set -euo pipefail
          EP="${{ secrets.CDN_ENDPOINT }}"
          EP="${EP%/}"
          printf '{"version":"%s","date":"%s"}\n' "${CLI_VERSION}" "$(date -u +%Y-%m-%d)" > latest.json
          aws s3 cp latest.json "s3://${{ secrets.CDN_BUCKET }}/cli/latest.json" \
            --endpoint-url "${EP}" --cache-control "no-cache" --no-progress
