name: CI

on:
  push:
    branches: [main]
  # Every PR, including one stacked on another PR's branch.
  pull_request:

# A new push to a PR cancels that PR's runs on older commits; they can only report on code that is
# no longer the PR's head. Pushes to main each get a group of their own, so every main commit runs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# The Docker Hub account the release workflows publish with, used here only to pull. Anonymous
# pulls are rate-limited per runner IP and CI was failing on 429 toomanyrequests. Empty where
# secrets are withheld (fork and Dependabot PRs): the login steps below then skip, and those
# runs pull anonymously as before rather than failing on a login with no credentials.
env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # No `any`, written or inherited from a library, and no cast that narrows to a type nobody checked,
  # in any TypeScript, Vue or Svelte file: eslint.config.mjs turns those rules on and makes
  # `eslint-disable` comments inert, so none can be switched off for a line.
  #
  # A job of its own so it runs beside `check` rather than before its typecheck and tests: it is the
  # longest single step there, and nothing else waits on it. The rules read types, and workspace
  # packages resolve one another through `dist`, so the packages are built first: before that, every
  # import of a sibling package would be `any`. The examples' own builds are not needed for that.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages
        run: pnpm turbo run build --filter="./packages/*"

      - name: Lint (no any)
        run: pnpm lint

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pulls Docker Hub images through mirror.gcr.io, which no rate limit applies to. Needs no
      # secrets, so it runs for forks too; restarts the daemon, so it comes before any container.
      - name: Use the Docker Hub mirror
        run: bash scripts/ci-docker-mirror.sh

      # Continues anonymously when Docker Hub is unavailable; fails on rejected credentials.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        run: bash scripts/ci-dockerhub-login.sh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # One small real pull, to show in the log whether pulls are served by the mirror.
          DOCKERHUB_VERIFY_MIRROR: "1"

      # Parses every shell `run:` block in .github/workflows with `bash -n`.
      #
      # Workflow shell is not executed until the workflow runs, and release workflows run on a
      # tag, so a syntax error there is found by a release rather than by CI. That has happened:
      # a stray backslash before a closing quote made a step unparseable, and it was only seen
      # when `brew install` ran for the first time during v0.1.10.
      - name: Workflow shell steps parse
        run: python3 scripts/lint-workflow-shell.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The CLI's signing tests sign and verify a release manifest with the real minisign. Under
      # CI they fail rather than skip when it is missing, so this step is what keeps them running.
      - name: Install minisign
        run: sudo apt-get install -y -qq minisign

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build

      # Every package's typecheck, then the root tsconfig.json (the config files beside each
      # package's build config, which no package's typecheck covers).
      - name: Typecheck
        run: pnpm typecheck

      # The build above has already built @supatype/types and @supatype/client.
      - name: RFC v2 migration checks
        run: |
          pnpm --filter @supatype/types test
          pnpm --filter @supatype/client test -- tests/types.test.ts
          pnpm --filter @supatype/cli exec vitest run tests/augmentation-generator.test.ts tests/migrate-from-v1.test.ts tests/type-extractor.test.ts

      - name: Runtime contract conformance
        run: pnpm --filter @supatype/cli exec vitest run tests/runtime-contract.test.ts

      - name: Test
        run: pnpm turbo run test

      # What the examples import, against what the packages export. Report-only by design: whether
      # an exotic primitive deserves an example is a judgement, and forcing one would produce the
      # forty-field model the kitchen sink argues against. What is gated is that the ledger stays
      # current: add an export and the committed numbers go stale, so the gap arrives in a diff
      # where a person decides.
      - name: Example coverage ledger is up to date
        run: |
          node scripts/check-example-coverage.mjs --write
          git diff --exit-code -- examples/COVERAGE.md \
            || { echo "::error::examples/COVERAGE.md is stale. Run 'node scripts/check-example-coverage.mjs --write' and commit it."; exit 1; }

      # The two examples that ship a front end and never proved it compiles.
      #
      # `blog` is typechecked and was never built, which cannot see a Server Component importing a
      # client-only API or a broken "use client" boundary. `supabucks` has no typecheck script, so
      # root turbo skips it entirely, and its `dist/` is what `app.mode = "static"` serves: a build
      # that emits nothing leaves the example's headline feature broken and silent. A build is not a
      # typecheck (Vite does not typecheck), but it is the difference between an example that
      # compiles and one nobody has run since it was written.
      - name: Example front ends build
        run: |
          pnpm --filter @supatype/example-supabucks build
          pnpm --filter @supatype/example-blog build

  # The CLI's own suite on the other platforms it ships for. Path separators, `.exe` suffixes and
  # temp directories differ there, and five Windows-only failures went unseen until a person ran
  # the suite by hand on Windows (C09). Linux runs it in `check` above.
  cli-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Same reason as in `check`: the signing tests fail under CI without minisign. Neither
      # runner image ships it.
      - name: Install minisign (macOS)
        if: runner.os == 'macOS'
        run: brew install minisign

      # The upstream release, pinned by version and sha256. The zip's minisign signature was
      # checked against the author's key (RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3)
      # when the hash was recorded; the hash is what holds it to that file from then on.
      - name: Install minisign (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479'
          $zip = Join-Path $env:RUNNER_TEMP 'minisign-0.12-win64.zip'
          Invoke-WebRequest -Uri 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip' -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "minisign-0.12-win64.zip has sha256 $actual, expected $expected" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          Join-Path $env:RUNNER_TEMP 'minisign-win64\x86_64' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CLI and what it depends on
        run: pnpm turbo run build --filter=@supatype/cli...

      - name: Test the CLI
        run: pnpm --filter @supatype/cli test

  # The functions worker's own tests: main.ts started as the image starts it, and a function's context
  # read back over HTTP. Run on the Deno the image is built FROM, read out of the Dockerfile so the
  # two cannot drift apart: a newer Deno passing would say nothing about the one that ships.
  functions-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the worker image's Deno version
        id: deno
        run: |
          version="$(sed -n 's/^FROM denoland\/deno:[a-z0-9]*-\([0-9][0-9.]*\)$/\1/p' packages/functions-worker/Dockerfile)"
          if [ -z "$version" ]; then
            echo "::error::packages/functions-worker/Dockerfile has no denoland/deno:<os>-<version> FROM line"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.deno.outputs.version }}

      - name: Test the functions worker
        working-directory: packages/functions-worker
        run: deno task test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pulls Docker Hub images through mirror.gcr.io, which no rate limit applies to. Needs no
      # secrets, so it runs for forks too; restarts the daemon, so it comes before any container.
      - name: Use the Docker Hub mirror
        run: bash scripts/ci-docker-mirror.sh

      # Continues anonymously when Docker Hub is unavailable; fails on rejected credentials.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        run: bash scripts/ci-dockerhub-login.sh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storage package
        run: pnpm --filter @supatype/storage build

      - name: Build docker image, storage
        uses: docker/build-push-action@v5
        with:
          context: packages/storage
          push: false

      - name: Build docker image, realtime
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/realtime/Dockerfile
          push: false

      - name: Build docker image, studio
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/studio/Dockerfile
          push: false

      - name: Build self-host-control package
        run: pnpm --filter "@supatype/self-host-control..." build

      # The engine the control plane copies, with its licence and notices, is the pinned one
      # (scripts/engine-pin.sh): the release image when .github/schema-engine-commit is an engine
      # release, otherwise a build of the pinned commit. Not :latest, which can predate both files.
      - name: Resolve the pinned engine image
        id: engine
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || github.token }}
        run: |
          set -euo pipefail
          image="$(bash scripts/engine-pin.sh image)"
          echo "image=$image" >>"$GITHUB_OUTPUT"

      - name: Build docker image, control-plane
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/self-host-control/Dockerfile
          push: false
          build-args: |
            ENGINE_IMAGE=${{ steps.engine.outputs.image }}
