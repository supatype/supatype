# Publish standalone supatype CLI binaries to releases.supatype.com/cli/
name: CLI release

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version string (e.g. 0.1.4)
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            pkg_target: node22-linux-x64
            output: supatype-cli-linux-amd64
          - platform: linux-arm64
            runner: ubuntu-24.04
            pkg_target: node22-linux-arm64
            output: supatype-cli-linux-arm64
          - platform: darwin-amd64
            runner: macos-14
            pkg_target: node22-macos-x64
            output: supatype-cli-darwin-amd64
          - platform: darwin-arm64
            runner: macos-14
            pkg_target: node22-macos-arm64
            output: supatype-cli-darwin-arm64
          - platform: windows-amd64
            runner: windows-latest
            pkg_target: node22-win-x64
            output: supatype-cli-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # release.yml does this before publishing to npm; without it here the binary carried
      # whatever version happened to be committed, which is never the one being released.
      - name: Stamp the release version across the workspace
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#cli-v}"
          if [ -n "${{ inputs.version }}" ]; then VERSION="${{ inputs.version }}"; fi
          node scripts/set-version.mjs "$VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Without this the binary ships EMBEDDED_RELEASE_PUBLIC_KEY = "", and binary-cache
      # fails closed: a new user's first `supatype dev` cannot verify the components it
      # downloads and stops with "No minisign public key configured".
      - name: Embed release public key (required)
        run: node scripts/embed-release-pubkey.mjs
        env:
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}

      - name: Bundle CLI
        run: |
          pnpm --filter @supatype/cli build
          node packages/cli/scripts/build-release-bundle.mjs

      - name: Package standalone binary
        run: |
          npx --yes @yao-pkg/pkg@6.6.0 packages/cli/release-bundle/supatype-cli-bundle.cjs --targets ${{ matrix.pkg_target }} --output ${{ matrix.output }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: ${{ matrix.output }}
          if-no-files-found: error

      - name: Upload to CDN
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CDN_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.CDN_AWS_REGION }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#cli-v}"
          if [ -n "${{ inputs.version }}" ]; then VERSION="${{ inputs.version }}"; fi
          EP="${{ secrets.CDN_ENDPOINT }}"
          EP="${EP%/}"
          BUCKET="${{ secrets.CDN_BUCKET }}"
          BASE="s3://${BUCKET}/cli/v${VERSION}"
          aws s3 cp "${{ matrix.output }}" "${BASE}/${{ matrix.output }}" --endpoint-url "${EP}" --no-progress

  publish-manifest:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Collect every platform's binary
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish checksums, manifest and installer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CDN_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.CDN_AWS_REGION }}
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#cli-v}"
          if [ -n "${{ inputs.version }}" ]; then VERSION="${{ inputs.version }}"; fi
          EP="${{ secrets.CDN_ENDPOINT }}"
          EP="${EP%/}"
          BUCKET="${{ secrets.CDN_BUCKET }}"

          # download-artifact nests each artifact in its own directory; the checksums file
          # lists bare names, because that is how install.sh and Homebrew refer to them.
          mkdir -p dist
          find artifacts -type f -name 'supatype-cli-*' -exec cp {} dist/ \;
          ( cd dist && sha256sum supatype-cli-* > checksums.sha256 && cat checksums.sha256 )

          # Versioned, so it can never disagree with the binaries beside it. Overwriting a
          # published path is what put a fresh checksum next to a stale archive on postgres.
          aws s3 cp dist/checksums.sha256 "s3://${BUCKET}/cli/v${VERSION}/checksums.sha256" \
            --endpoint-url "${EP}" --no-progress

          printf '{"version":"%s","date":"%s"}\n' "${VERSION}" "$(date -u +%Y-%m-%d)" > latest.json
          aws s3 cp latest.json "s3://${BUCKET}/cli/latest.json" --endpoint-url "${EP}" --cache-control "no-cache" --no-progress

          # The documented entry point — `curl -fsSL https://releases.supatype.com/install.sh | bash`
          # 404s until something puts it there, and nothing did.
          aws s3 cp scripts/install.sh "s3://${BUCKET}/install.sh" \
            --endpoint-url "${EP}" --cache-control "no-cache" \
            --content-type "text/x-shellscript" --no-progress

  update-homebrew-formula:
    name: Homebrew formula
    needs: [build, publish-manifest]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: cli-artifacts
          pattern: cli-*
          merge-multiple: true

      - name: Generate Formula/supatype.rb
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#cli-v}"
          if [ -n "${{ inputs.version }}" ]; then VERSION="${{ inputs.version }}"; fi
          mkdir -p homebrew-input homebrew-formula/Formula
          find cli-artifacts -type f -name 'supatype-cli-*' ! -name '*.exe' -exec cp {} homebrew-input/ \;
          ls -la homebrew-input
          HOMEBREW_FORMULA_OUT=homebrew-formula/Formula/supatype.rb \
            node packages/cli/scripts/generate-homebrew-formula.mjs "${VERSION}" homebrew-input

      - name: Upload Homebrew formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: homebrew-formula/Formula/supatype.rb
          if-no-files-found: error

      - name: Push formula to supatype/homebrew (optional)
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN not set — skipping tap push"
            exit 0
          fi
          TAP_REPO="${TAP_REPO:-supatype/homebrew}"
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#cli-v}"
          if [ -n "${{ inputs.version }}" ]; then VERSION="${{ inputs.version }}"; fi
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp homebrew-formula/Formula/supatype.rb tap/Formula/supatype.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/supatype.rb
          git diff --staged --quiet && echo "No formula changes" && exit 0
          git commit -m "supatype ${VERSION}"
          git push origin HEAD:main
