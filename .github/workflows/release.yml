name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Release gate ────────────────────────────────────────────────────────────
  #
  # A tag used to publish npm packages and five Docker images with nothing
  # checked, not even `ci.yml`. On 2026-09-24 that shipped a feature that had
  # never once worked, while the integration suite had been red for ten days.
  #
  # Every other job roots at `prepare`, so gating `prepare` gates the release.
  #
  # Tags are not covered by branch protection, so a required-status-check rule
  # cannot do this. It has to be a job.
  #
  # To release over a red suite, set the repository variable
  # RELEASE_SKIP_GATE to the exact tag. Scoping it to one tag is deliberate:
  # a boolean would get switched on during an incident and stay on.
  gate:
    name: required checks are green for this commit
    runs-on: ubuntu-latest
    steps:
      - name: CI and Integration must have succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          SKIP_FOR: ${{ vars.RELEASE_SKIP_GATE }}
        run: |
          set -euo pipefail
          if [ "${SKIP_FOR:-}" = "$TAG" ]; then
            echo "::warning::Gate skipped: RELEASE_SKIP_GATE is set to $TAG."
            exit 0
          fi
          fail=0
          for wf in ci.yml integration.yml; do
            conclusion=$(gh api \
              "repos/$REPO/actions/workflows/$wf/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "missing"')
            echo "$wf -> $conclusion"
            # "missing" covers a tag on a commit that never ran the suite;
            # a null conclusion covers one that is still running. Neither may publish.
            if [ "$conclusion" != "success" ]; then
              echo "::error::$wf is '$conclusion' for $SHA. A tag may not publish over it."
              fail=1
            fi
          done
          exit "$fail"

  # ── Image pins ──────────────────────────────────────────────────────────────
  #
  # The engine, server and Postgres this release ships, renders into every compose file and trains
  # against are the ones release/images.json pins, never whatever :latest is on the day. Each must
  # be a stable release: a tag in its repository names the pinned commit, that tag is published on
  # Docker Hub (and, for the engine, its image's revision label is that commit), and its binary is
  # on the CDN for `supatype dev` (scripts/pin.sh check). The control-plane image copies its
  # engine, licence and notices from the engine release image, by digest. A pin that is not a
  # release stops the tag here, before anything publishes; the release PR moves a pin with
  # `bash scripts/pin.sh set <component> <tag>`.
  pins:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.pins.outputs.engine }}
      server: ${{ steps.pins.outputs.server }}
      postgres: ${{ steps.pins.outputs.postgres }}
      engine_image: ${{ steps.engine.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Every pin is a published release
        id: pins
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || github.token }}
        run: |
          set -euo pipefail
          bash scripts/pin.sh check --release-only | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Image pins"
            for c in engine server postgres; do echo "- $(bash scripts/pin.sh image "$c") ($c@$(bash scripts/pin.sh commit "$c"))"; done
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Resolve the pinned engine release image
        id: engine
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || github.token }}
        run: |
          set -euo pipefail
          image="$(bash scripts/pin.sh engine-image --release-only)"
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "- control-plane engine: $image" >>"$GITHUB_STEP_SUMMARY"

  # ── Release train ───────────────────────────────────────────────────────────
  #
  # Every artifact built from this commit and from the engine, server and Postgres commits the pins
  # name, and every e2e and regression suite run against those builds (release-train.yml). So the
  # train tests exactly the components this release ships, not the other repositories' default
  # branches. A tag publishes nothing unless it is green. Without PRIVATE_REPO_TOKEN the train
  # leaves out the cloud image, which no self-host suite runs, and is still green.
  train:
    needs: [gate, pins]
    uses: ./.github/workflows/release-train.yml
    with:
      supatype_sha: ${{ github.sha }}
      schema_engine_sha: ${{ needs.pins.outputs.engine }}
      supatype_auth_sha: ${{ needs.pins.outputs.server }}
      supatype_postgres_sha: ${{ needs.pins.outputs.postgres }}
    secrets: inherit

  # ── Extract version from tag ────────────────────────────────────────────────
  prepare:
    needs: [gate, pins, train]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # ── Docker Hub `latest`: stable releases always move it; a prerelease (any version with a
  #     '-') moves it only until a vX.Y.Z tag exists in the repo, then prereleases stop moving it ──
  docker-latest-policy:
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      docker_push_latest: ${{ steps.policy.outputs.docker_push_latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to update Docker Hub latest tag
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.prepare.outputs.version }}'
          # The one prerelease rule every latest channel uses: a '-' anywhere in the version.
          IS_PRE=false
          case "$VERSION" in
            *-*) IS_PRE=true ;;
          esac

          HAS_STABLE=false
          while IFS= read -r t; do
            [[ -z "${t:-}" ]] && continue
            rest="${t#v}"
            [[ "$rest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            HAS_STABLE=true
            break
          done < <(git tag -l 'v[0-9]*')

          if [[ "$IS_PRE" != true ]] || [[ "$HAS_STABLE" != true ]]; then
            echo "docker_push_latest=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub latest=yes (version=${VERSION}, prerelease=${IS_PRE}, stable_tag_in_repo=${HAS_STABLE})"
          else
            echo "docker_push_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub latest=no, prerelease ${VERSION} will not move :latest while a stable vX.Y.Z tag exists"
          fi

  # ── Build, test, and publish npm packages ───────────────────────────────────
  # The standalone CLI, from the same tag and the same version as everything else.
  #
  # This runs before npm publishes, deliberately. Publishing to the CDN is additive and every
  # path is immutable, so a bad attempt is superseded by the next version and costs nothing;
  # an npm publish cannot be undone. Doing the reversible half first, and only reaching the
  # irreversible half once the binaries have been compiled, signed and executed on real
  # hardware, is the closest this can get to an atomic release.
  #
  # It also waits for every image the CLI runs at its own version (supatype/{storage,realtime,
  # functions-worker,studio,control-plane}:<version>, packages/cli/src/generated/release-images.ts).
  # The CDN publish moves cli/latest.json, and a CLI that reaches users before its images are on
  # Docker Hub, or after one of them failed to build, fails every `supatype dev` with "manifest
  # unknown". The same holds for the realtime binaries a release CLI downloads at its own version
  # (the realtime job below), so it waits for those too. npm and Homebrew name every one of these
  # jobs again, so the guarantee does not rest on this one line. A rerun keeps its skips: each
  # image push is idempotent, and the CDN and npm steps skip what is already published.
  cli:
    needs: [prepare, realtime, docker-storage, docker-realtime, docker-functions-worker, docker-studio, docker-control-plane]
    uses: ./.github/workflows/cli-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  # The standalone realtime binaries `supatype dev` runs natively, from the same tag and version
  # as the CLI and the supatype/realtime image. npm waits on it for the reason it waits on the
  # CLI: the CDN half is additive and immutable, the npm half cannot be undone, so a realtime
  # build or signing failure stops the release while it can still be superseded.
  realtime:
    needs: prepare
    uses: ./.github/workflows/realtime-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  # npm ships @supatype/cli, which runs the images below and the realtime binaries at its own
  # version, so it waits for them.
  npm:
    needs: [prepare, cli, realtime, docker-storage, docker-realtime, docker-functions-worker, docker-studio, docker-control-plane]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set version in all packages
        run: node scripts/set-version.mjs ${{ needs.prepare.outputs.version }}

      - name: Authenticate with npm registry
        run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `Test` below runs the CLI's signing tests, which fail rather than skip under CI without it.
      - name: Install minisign
        run: sudo apt-get install -y -qq minisign

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Embed release public key (required)
        run: node scripts/embed-release-pubkey.mjs
        env:
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}

      - name: Build
        run: pnpm turbo run build

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Publish npm packages
        shell: bash
        run: |
          set -euo pipefail
          PACKAGES=(
            types
            shared
            plugin-sdk
            client
            common
            react
            react-auth
            react-native
            react-native-auth
            ssr
            ui
            plugin-seo
            plugin-color-picker
            plugin-phone-field
            solid
            svelte
            vue
            cli
          )
          # npm refuses to publish a version twice, so a rerun after a partial publish would stop
          # at the first package already out and block the GitHub release. Skip those instead.
          for pkg in "${PACKAGES[@]}"; do
            if [ -n "$(npm view "@supatype/${pkg}@${VERSION}" version 2>/dev/null)" ]; then
              echo "::warning::@supatype/${pkg}@${VERSION} is already on npm. Skipping it."
              continue
            fi
            echo "::group::Publish @supatype/${pkg}"
            pnpm --filter "@supatype/${pkg}" publish --access public --no-git-checks --tag "$NPM_PUBLISH_TAG"
            echo "::endgroup::"
          done
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # A prerelease (any version with a '-') never takes `latest`, which is what a bare
          # `npm install @supatype/cli` resolves. Alphas and betas keep their own dist-tags;
          # every other prerelease, such as an rc, goes to `next`.
          NPM_PUBLISH_TAG: ${{ contains(needs.prepare.outputs.version, '-') && (contains(needs.prepare.outputs.version, 'alpha') && 'alpha' || contains(needs.prepare.outputs.version, 'beta') && 'beta' || 'next') || 'latest' }}

  # ── Build and push Docker images ────────────────────────────────────────────
  docker-storage:
    needs: [prepare, docker-latest-policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set version in all packages
        run: node scripts/set-version.mjs ${{ needs.prepare.outputs.version }}

      - name: Install and build storage
        run: pnpm install --frozen-lockfile && pnpm --filter @supatype/storage build

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: supatype/storage
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.docker-latest-policy.outputs.docker_push_latest == 'true' }}

      - uses: docker/build-push-action@v5
        with:
          context: packages/storage
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-realtime:
    needs: [prepare, docker-latest-policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: supatype/realtime
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.docker-latest-policy.outputs.docker_push_latest == 'true' }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/realtime/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-functions-worker:
    needs: [prepare, docker-latest-policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: supatype/functions-worker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.docker-latest-policy.outputs.docker_push_latest == 'true' }}

      - uses: docker/build-push-action@v5
        with:
          context: packages/functions-worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-studio:
    needs: [prepare, docker-latest-policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: supatype/studio
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.docker-latest-policy.outputs.docker_push_latest == 'true' }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/studio/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-control-plane:
    needs: [prepare, docker-latest-policy, pins]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build self-host-control
        run: pnpm install --frozen-lockfile && pnpm --filter "@supatype/self-host-control..." build

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: supatype/control-plane
          # Explicit, so the repository-level Apache-2.0 the action detects cannot hide the engine binary
          # (BUSL-1.1) that this image also carries.
          labels: |
            org.opencontainers.image.licenses=Apache-2.0 AND BUSL-1.1
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.docker-latest-policy.outputs.docker_push_latest == 'true' }}

      # schema-engine is versioned on its own, so the engine image tag is not the monorepo version.
      # It is the pinned engine release, by digest (the pins job), not :latest: :latest is
      # whatever the engine last published, which can predate the licence files this image copies.
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/self-host-control/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENGINE_IMAGE=${{ needs.pins.outputs.engine_image }}

  # ── GitHub Release ──────────────────────────────────────────────────────────
  github-release:
    needs: [prepare, npm, docker-storage, docker-realtime, docker-functions-worker, docker-studio, docker-control-plane]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # A prerelease is never the repository's "latest" release on GitHub.
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: true

  # Homebrew lives here, not inside the reusable CLI workflow. It used to, and because npm
  # depends on that workflow as a unit, a failure pushing a formula blocked the npm publish:
  # v0.1.8 shipped to the CDN and to Docker Hub while npm stayed on 0.1.7. Publishing a
  # formula is a post-release action, so it belongs beside github-release, where failing is
  # loud without holding up a release that already succeeded.
  #
  # Gated on a repo variable, not on whether the token exists: secrets are unavailable in any
  # `if:`, and inferring "configured" from a credential's presence reports an expired token as
  # a green skip.
  #
  # The tap has one formula and `brew upgrade` moves every user to it, so a prerelease (any
  # version with a '-') must not replace it. verify-homebrew-install needs this job and has no
  # always(), so it is skipped with it.
  #
  # Like npm, it waits for the images and realtime binaries the CLI runs at its own version.
  homebrew-formula:
    name: Homebrew formula
    needs: [prepare, cli, realtime, docker-storage, docker-realtime, docker-functions-worker, docker-studio, docker-control-plane]
    runs-on: ubuntu-24.04
    if: vars.HOMEBREW_TAP_REPO != '' && !contains(needs.prepare.outputs.version, '-')
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The manifest comes from the CDN, not from a build artefact. A formula should describe
      # what was published rather than what a job happened to have on disk, and this job runs in
      # the caller while the artefact was uploaded by a called workflow, which is a dependency
      # worth not having. Fetching it also means a formula can be regenerated for an existing
      # release without rebuilding anything.
      - name: Fetch the published manifest and generate Formula/supatype.rb
        run: |
          set -euo pipefail
          mkdir -p published homebrew-formula/Formula
          MANIFEST="https://releases.supatype.com/cli/v${VERSION}/checksums.sha256"
          if ! curl -fsSL "$MANIFEST" -o published/checksums.sha256; then
            echo "::error::$MANIFEST is not readable, so the CLI publish did not complete."
            exit 1
          fi
          curl -fsSL "${MANIFEST}.minisig" -o published/checksums.sha256.minisig

          # Verified before it is trusted, since every hash in the formula comes from it. The key
          # is the one committed in the installer, matched on its RW prefix: minisign public keys
          # always start with that, and grep avoids a backreference that would need escaping.
          KEY="$(grep -o 'RW[A-Za-z0-9+/=]\{40,\}' scripts/install.sh | head -1)"
          if [ -z "$KEY" ]; then
            echo "::error::could not read the release public key out of scripts/install.sh"
            exit 1
          fi
          sudo apt-get install -y -qq minisign
          printf 'untrusted comment: supatype release key\n%s\n' "$KEY" > published/key.pub
          minisign -V -p published/key.pub -m published/checksums.sha256

          cat published/checksums.sha256
          HOMEBREW_FORMULA_OUT=homebrew-formula/Formula/supatype.rb \
            node packages/cli/scripts/generate-homebrew-formula.mjs "${VERSION}" published

      - name: Push formula to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'supatype/homebrew-tap' }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "HOMEBREW_TAP_REPO is set but HOMEBREW_TAP_GITHUB_TOKEN is not." >&2
            echo "Add the token, or clear the variable to disable Homebrew publishing." >&2
            exit 1
          fi
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp homebrew-formula/Formula/supatype.rb tap/Formula/supatype.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/supatype.rb
          git diff --staged --quiet && echo "No formula changes" && exit 0
          git commit -m "supatype ${VERSION}"
          git push origin HEAD:main

  # A formula ships only once Homebrew has installed from it. Valid-looking Ruby proves nothing:
  # the URLs have to resolve, the sha256 has to match what the CDN serves, and bin.install has to
  # find that name inside the archive. Both arches, because the formula picks a different URL on
  # each and only one can be wrong at a time.
  verify-homebrew-install:
    name: brew install (${{ matrix.arch }})
    needs: [prepare, homebrew-formula]
    if: vars.HOMEBREW_TAP_REPO != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: intel
            runner: macos-15-intel
    steps:
      - name: Install from the tap and run it
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAP: ${{ vars.HOMEBREW_TAP_REPO || 'supatype/homebrew-tap' }}
        run: |
          set -euo pipefail
          # The tap name drops the homebrew- prefix: supatype/homebrew-tap taps as supatype/tap.
          #
          # Built from prefix removal rather than ${TAP/\/homebrew-/\/}: a backslash in a bash
          # replacement is consumed by bash 5 and kept by the bash 3.2 macOS ships, so that form
          # worked when tested on Linux and produced `supatype\/homebrew-tap` on the runner. These
          # expansions contain no delimiter to escape, so they cannot differ between versions.
          TAP_OWNER="${TAP%%/*}"
          TAP_REPO_NAME="${TAP##*/}"
          TAP_NAME="${TAP_OWNER}/${TAP_REPO_NAME#homebrew-}"
          echo "tapping $TAP_NAME (from repository $TAP)"
          brew tap "$TAP_NAME"
          brew install --formula "$TAP_NAME/supatype"

          got="$(supatype --version)"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::brew installed $got, expected $VERSION"
            exit 1
          fi
          echo "installed and running: $got"
          supatype --help | head -3

