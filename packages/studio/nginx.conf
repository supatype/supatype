server {
    listen 3002;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cookies are not scoped by port, so every project a developer runs on localhost shares one
    # cookie jar and Studio is sent all of it, including cookies belonging to unrelated stacks on
    # other ports. nginx's default of four 8k buffers is exceeded by a machine with a few dev
    # projects on it, and the answer is "Request header or cookie too large" from a component the
    # developer never configured, about cookies belonging to something else.
    #
    # The two numbers do different jobs. The size is the ceiling on any one header line, and the
    # cookie jar arrives as a single `Cookie:` line, so 32k is the figure that matters here. The
    # count is how many oversized lines may be buffered at once: measured, four 30KB headers pass
    # and a fifth is refused with 400. It matches the Kong gateway's setting deliberately, so that
    # a request does not pass one hop and fail the next.
    #
    # nginx allocates these lazily, only for a connection that actually overflows the standard
    # header buffer, so an ordinary request pays nothing for them.
    large_client_header_buffers 4 32k;

    # Assets are content-hashed by the build, so a given URL's bytes never change and the browser
    # should never ask again. This is the half that makes the `no-cache` below cheap.
    #
    # One `Cache-Control`, not two: `expires 1y` emits its own, and combining it with `add_header`
    # sent the header twice with different values.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # `index.html` names those hashed assets, so a cached copy of it points at the *previous*
    # build's files. Upgrade Studio in place and the browser keeps serving the old page until
    # something evicts it: the symptom is a version that half-works, and a fix nobody should
    # have to know about: a hard refresh.
    #
    # `no-cache` is not "do not store": the browser keeps the copy and revalidates, so an unchanged
    # page still costs a 304 rather than a download.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # `config.js` is written at container start from SUPATYPE_CLOUD_JSON, so its contents change
    # per deployment while its URL does not. A cached copy points Studio at the wrong API.
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # Deep links land here and are served the shell. They inherit the no-cache above rather
    # than needing their own: the final try_files argument is an internal redirect, so the
    # request re-enters location matching and hits the exact match. Verified, not assumed.
    # Giving this block its own root or index would end that and nothing here would fail.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
